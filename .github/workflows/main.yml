name: Build and Deploy Murtal Smart Quran

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Android SDK Build Tools
      run: |
        export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            printf 'y\ny\ny\ny\ny\n' | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi
        fi

    - name: Install dependencies
      run: npm install --legacy-peer-deps --no-audit --no-fund

    - name: Run type checking / linter
      run: npm run lint

    - name: Build Web App & Real Signed APK Package
      run: npm run build:apk

    - name: Verify APK Output
      run: ls -lh public/downloads/murtal-quran.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: murtal-quran-apk
        path: public/downloads/murtal-quran.apk
